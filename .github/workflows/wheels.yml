name: Wheels

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      cold-windows:
        description: Build Windows dependencies without the binary cache
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "0 8 1 * *"

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          prune-cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev libflint-dev

      - name: Test source package
        run: uv run --python ${{ matrix.python-version }} --group dev pytest

  build-linux-wheels:
    name: manylinux wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve micromamba release
        shell: bash
        run: |
          set -euo pipefail
          version=2.9.0
          basename="linux-64/micromamba-$version-0.tar.bz2"
          curl -fsSL "https://api.anaconda.org/release/conda-forge/micromamba/$version" |
            jq -er --arg basename "$basename" '
              .distributions[]
              | select(.basename == $basename)
              | "MICROMAMBA_URL=https:\(.download_url)\nMICROMAMBA_SHA256=\(.sha256)"
            ' >> "$GITHUB_ENV"

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_ENVIRONMENT_PASS_LINUX: MICROMAMBA_URL MICROMAMBA_SHA256
          CIBW_BEFORE_ALL_LINUX: |
            set -eux
            archive=/tmp/micromamba.tar.bz2
            curl -fsSL "$MICROMAMBA_URL" -o "$archive"
            printf '%s  %s\n' "$MICROMAMBA_SHA256" "$archive" | sha256sum --check -
            tar -xjf "$archive" -C /tmp bin/micromamba
            /tmp/bin/micromamba --no-rc create --yes \
              --root-prefix /tmp/micromamba-root \
              --prefix /opt/fnvcrack-deps \
              --file {project}/manylinux.conda-lock.yml
            test -f /opt/fnvcrack-deps/include/flint/flint.h
            test -f /opt/fnvcrack-deps/lib/libflint.so
            ldd_output="$(ldd /opt/fnvcrack-deps/lib/libflint.so)"
            printf '%s\n' "$ldd_output"
            ! printf '%s\n' "$ldd_output" | grep -q 'not found'
            rm -rf "$archive" /tmp/bin /tmp/micromamba-root
        with:
          extras: uv
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fnvcrack-manylinux-wheels
          path: wheelhouse/*.whl
          retention-days: 7

  build-windows-wheels:
    name: Windows AMD64 wheels
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-cache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set vcpkg cache key
        shell: pwsh
        run: |
          "VCPKG_CACHE_IMAGE=$env:ImageOS" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_CACHE_VERSION=$env:ImageVersion" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up pinned vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content "$env:GITHUB_WORKSPACE\vcpkg.json" | ConvertFrom-Json).'builtin-baseline'
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --no-checkout https://github.com/microsoft/vcpkg.git $vcpkgRoot
          git -C $vcpkgRoot checkout --detach $baseline
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          "FNVCRACK_VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache vcpkg binaries
        if: github.event_name != 'schedule' && inputs['cold-windows'] != true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_CACHE_IMAGE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/vcpkg-ports/**') }}-${{ env.VCPKG_CACHE_VERSION }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_CACHE_IMAGE }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'tools/vcpkg-ports/**') }}-

      - name: Install native dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:FNVCRACK_VCPKG_ROOT\vcpkg.exe" install `
            "--triplet=x64-windows" `
            "--x-manifest-root=$env:GITHUB_WORKSPACE" `
            "--x-install-root=$env:FNVCRACK_VCPKG_ROOT\installed"
          $deps = Join-Path $env:FNVCRACK_VCPKG_ROOT "installed\x64-windows"
          "FNVCRACK_DEPS=$deps" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          extras: uv
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fnvcrack-windows-amd64-wheels
          path: wheelhouse/*.whl
          retention-days: 7

  build-macos-wheels:
    name: macOS ${{ matrix.arch }} wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            deployment_target: "15.0"
          - runner: macos-15
            arch: arm64
            deployment_target: "15.0"

    env:
      CIBW_ARCHS_MACOS: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        with:
          extras: uv
          output-dir: wheelhouse

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fnvcrack-macos-${{ matrix.arch }}-wheels
          path: wheelhouse/*.whl
          retention-days: 7

  build-sdist:
    name: source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true
          prune-cache: true

      - name: Build source distribution
        run: uv build --sdist --out-dir dist --no-sources

      - name: Upload source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fnvcrack-sdist
          path: dist/*.tar.gz
          retention-days: 7

  test-wheels:
    name: Test ${{ matrix.name }} wheel
    needs:
      - build-linux-wheels
      - build-macos-wheels
      - build-windows-wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: manylinux x86_64
            runner: ubuntu-24.04
            artifact: fnvcrack-manylinux-wheels
          - name: Windows AMD64
            runner: windows-2025-vs2026
            artifact: fnvcrack-windows-amd64-wheels
          - name: macOS x86_64
            runner: macos-15-intel
            artifact: fnvcrack-macos-x86_64-wheels
          - name: macOS ARM64
            runner: macos-15
            artifact: fnvcrack-macos-arm64-wheels

    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install wheel without an index
        run: python -m pip install --no-index --find-links wheelhouse fnvcrack

      - name: Check installed dependencies
        run: python -m pip check

      - name: Smoke test wheel
        run: python -I -c "from fnvcrack import CrackContext; result = CrackContext(valid_chars=b'a').crack(0xaf63dc4c8601ec8c, crack_len=1); assert result.value == b'a', result"

  test-sdist:
    name: Test source distribution
    needs:
      - build-sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Download source artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fnvcrack-sdist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev libflint-dev pkg-config

      - name: Install source distribution
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install dist/*.tar.gz

      - name: Smoke test source distribution
        run: .venv/bin/python -I -c "from fnvcrack import CrackContext; result = CrackContext(valid_chars=b'a').crack(0xaf63dc4c8601ec8c, crack_len=1); assert result.value == b'a', result"

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
      - test
      - test-sdist
      - test-wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/fnvcrack

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fnvcrack-*
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"

      - name: Publish to PyPI
        run: uv publish dist/*
