name: Wheels

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgmp-dev libflint-dev

      - name: Test source package
        run: uv run --python ${{ matrix.python-version }} --group dev pytest

  build-linux-wheels:
    name: manylinux wheels
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          extras: uv
          output-dir: wheelhouse

      - name: Upload release artifacts
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: fnvcrack-manylinux-wheels
          path: wheelhouse/*.whl

  build-windows-wheels:
    name: Windows AMD64 wheels
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native dependencies
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install flint:x64-windows
          $deps = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          "FNVCRACK_DEPS=$deps" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          extras: uv
          output-dir: wheelhouse

      - name: Upload release artifacts
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: fnvcrack-windows-amd64-wheels
          path: wheelhouse/*.whl

  build-macos-wheels:
    name: macOS ${{ matrix.arch }} wheels
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
            deployment_target: "15.0"
          - runner: macos-14
            arch: arm64
            deployment_target: "14.0"

    env:
      CIBW_ARCHS_MACOS: ${{ matrix.arch }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          extras: uv
          output-dir: wheelhouse

      - name: Upload release artifacts
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: fnvcrack-macos-${{ matrix.arch }}-wheels
          path: wheelhouse/*.whl

  build-sdist:
    name: source distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build source distribution
        run: uv build --sdist --out-dir dist --no-sources

      - name: Upload release artifacts
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: fnvcrack-sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published'
    needs:
      - test
      - build-linux-wheels
      - build-macos-wheels
      - build-windows-wheels
      - build-sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/p/fnvcrack

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: fnvcrack-*
          path: dist
          merge-multiple: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish dist/*
